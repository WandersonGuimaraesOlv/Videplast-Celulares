# Celulares e Chips — sobe as telas (Nginx) + a API (Node) no servidor Linux.
# Uso: cp env.exemplo .env && chmod 600 .env && (preencha o .env) && docker compose up -d --build
name: celulares

services:
  web:
    build:
      context: .
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-celulares}
    restart: unless-stopped
    environment:
      LIMITE_UPLOAD_MB: ${LIMITE_UPLOAD_MB:-20}
    depends_on:
      - api
    ports:
      # Só na máquina local: o Nginx do servidor (com o Portal de Acesso na frente) aponta para cá.
      - "127.0.0.1:${CELULARES_PORTA:-8097}:80"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      BUCKET_FOTOS: ${BUCKET_FOTOS:-celulares-fotos}
      FILIAL: ${FILIAL:-1005}
      LIMITE_UPLOAD_MB: ${LIMITE_UPLOAD_MB:-20}
    # Sem porta publicada: só o container web acessa
